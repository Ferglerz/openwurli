[package]
name = "cpu-ab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
experimental-circuit-lut = ["openwurli-dsp/experimental-circuit-lut"]

[dependencies]
openwurli-dsp = { path = "../../crates/openwurli-dsp" }
cpu-ab-scalar = { path = "scalar" }
cpu-ab-shipping = { path = "shipping" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"

[workspace]
members = ["scalar", "shipping"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/hal0zer0/openwurli"
authors = ["hal0zer0"]

[workspace.dependencies]
melange-primitives = { git = "https://github.com/hal0zer0/melange", rev = "7ecb36c" }
