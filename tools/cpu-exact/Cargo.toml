[package]
name = "cpu-exact"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
openwurli-dsp = { path = "../../crates/openwurli-dsp", features = ["runtime-models"] }
cpu-exact-reference = { path = "reference", features = ["runtime-models"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"

[profile.release]
debug = 1

[workspace]
members = ["reference"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/hal0zer0/openwurli"
authors = ["hal0zer0"]

[workspace.dependencies]
melange-primitives = { git = "https://github.com/hal0zer0/melange", rev = "7ecb36c" }
